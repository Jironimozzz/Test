name: Deploy to VibeCode

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_ID: 1bca73f7-c34d-4e7f-92a1-7f9aa893d67d
      VIBECODE_API_BASE: https://vibecode.bitrix24.tech/v1
      VIBE_CODE_MAIN: ${{ secrets.VIBE_CODE_MAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VIBE_CODE_MAIN:-}" ]]; then
            echo "Secret VIBE_CODE_MAIN is not set" >&2
            exit 1
          fi

      - name: Build source archive URL for current commit
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" >> "$GITHUB_ENV"

      - name: Trigger VibeCode deploy
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"

          payload=$(jq -nc \
            --arg source_url "$SOURCE_URL" \
            --arg start "cd /opt/app && npx serve -s . -l 3000" \
            --arg install "cd /opt/app && (npm ci --omit=dev || npm install --omit=dev || true)" \
            '{source:{url:$source_url},start:$start,install:$install,runtime:"node20",port:3000}')

          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$VIBECODE_API_BASE/infra/servers/$SERVER_ID/deploy?stream=false" \
            -H "X-Api-Key: $VIBE_CODE_MAIN" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "Deploy API HTTP status: $http_code"
          cat "$response_file"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Deployment trigger failed" >&2
            exit 1
          fi
